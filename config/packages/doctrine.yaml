doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
    orm:
        enable_native_lazy_objects: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: false
        mappings:
            Access:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Access/Domain'
                prefix: 'App\Access\Domain'
            Identity:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Identity/Domain/Model'
                prefix: 'App\Identity\Domain\Model'
            Repo:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Repo/Domain/Model'
                prefix: 'App\Repo\Domain\Model'
            Webhook:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Webhook/Domain/Model'
                prefix: 'App\Webhook\Domain\Model'
            Lfs:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Lfs/Domain/Model'
                prefix: 'App\Lfs\Domain\Model'
            Deploy:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Deploy/Domain/Model'
                prefix: 'App\Deploy\Domain\Model'
            Wiki:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Wiki/Domain/Model'
                prefix: 'App\Wiki\Domain\Model'

when@prod:
    doctrine:
        orm:
            metadata_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool

    framework:
        cache:
            pools:
                doctrine.system_cache_pool:
                    adapter: cache.system
