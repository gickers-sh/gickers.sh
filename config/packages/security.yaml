security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
    providers:
        app_users:
            id: App\Identity\Infrastructure\Security\SecurityUserProvider
    firewalls:
        # SSH sessions set their PreAuthenticatedToken directly (SshEntrypointCommand); never matched by HTTP.
        ssh:
            pattern: ^/_ssh$
            stateless: true
            provider: app_users
        git:
            pattern: ^/
            stateless: true
            provider: app_users
            entry_point: App\UI\Http\Security\GitAuthChallenge
            custom_authenticators:
                - App\UI\Http\Security\AccessTokenAuthenticator
            access_token:
                token_handler: App\UI\Http\Security\JwtAccessTokenHandler
                failure_handler: App\UI\Http\Security\GitAuthChallenge

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
    services:
        test.access_guard:
            alias: App\Access\Application\AccessGuard
            public: true
        test.create_user:
            alias: App\Identity\Application\CreateUser
            public: true
        test.delete_user:
            alias: App\Identity\Application\DeleteUser
            public: true
        test.rename_user:
            alias: App\Identity\Application\RenameUser
            public: true
        test.set_admin:
            alias: App\Identity\Application\SetAdmin
            public: true
        test.add_public_key:
            alias: App\Identity\Application\AddPublicKey
            public: true
        test.remove_public_key:
            alias: App\Identity\Application\RemovePublicKey
            public: true
        test.set_password:
            alias: App\Identity\Application\SetPassword
            public: true
        test.sign_up:
            alias: App\Identity\Application\SignUp
            public: true
        test.issue_access_token:
            alias: App\Identity\Application\IssueAccessToken
            public: true
        test.revoke_access_token:
            alias: App\Identity\Application\RevokeAccessToken
            public: true
        test.authenticate_ssh_key:
            alias: App\Identity\Application\AuthenticateSshKey
            public: true
        test.authenticate_access_token:
            alias: App\Identity\Application\AuthenticateAccessToken
            public: true
        test.bootstrap_server:
            alias: App\Identity\Application\BootstrapServer
            public: true
