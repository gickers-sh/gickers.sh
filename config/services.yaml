parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            - '../src/*/Domain/'
            - '../src/UI/Tui/View/'
            - '../src/UI/Tui/Widget/'
            - '../src/UI/Tui/Format/'
            - '../src/UI/Tui/{TuiApp,Navigator,InputRouter,HitTester,AsyncLoader,Session,Views}.php'
            - '../src/Shared/Infrastructure/Config/ServerSettings.php'
            - '../src/UI/Ssh/Command/'

    # SSH CLI commands (spec §2.5): wired into the dedicated SshCliApplication via the
    # app.ssh_command tag, never exposed in bin/console. Excluded from the App\ resource above.
    App\UI\Ssh\Command\:
        resource: '../src/UI/Ssh/Command/'
        exclude:
            - '../src/UI/Ssh/Command/AbstractSshCommand.php'
        autoconfigure: false
        tags: ['app.ssh_command']

    App\UI\Tui\Render\TermstrapRenderer:
        lazy: true

    Termstrap\Command\RenderCommand:
        tags: ['console.command']
