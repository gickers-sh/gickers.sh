# Multi-container deployment for gickers.sh.
#
# One shared image (PHP app + FrankenPHP + the Go gickers-ssh gateway) runs four
# roles against one shared `.data` volume and a Postgres database:
#   init    one-shot: data dir, migrations, cache warmup, bootstrap, host keys
#   http    FrankenPHP worker mode (binds :80 inside the container)
#   ssh     gickers-ssh gateway
#   worker  Messenger consumer (async + scheduler)
#
# Host ports are configurable: HTTP_PORT (default 80), SSH_PORT (default 2223).
# `make run` on the host is unaffected — it never touches this file.

name: gickers-sh

x-app: &app
  build:
    context: .
  image: gickers-sh:latest
  environment: &app-env
    APP_ENV: ${APP_ENV:-prod}
    APP_DEBUG: ${APP_DEBUG:-0}
    APP_SECRET: ${APP_SECRET:?set APP_SECRET in .env.docker}
    APP_DOMAIN: ${APP_DOMAIN:-gits.run}
    GICKERS_SSH_BIN: /usr/local/bin/gickers-ssh
    CODES_SSH_BIN: /usr/local/bin/gickers-ssh
    DATABASE_URL: postgresql://${POSTGRES_USER:-gickers}:${POSTGRES_PASSWORD:-gickers}@postgres:5432/${POSTGRES_DB:-gickers}?serverVersion=16&charset=utf8
    MESSENGER_TRANSPORT_DSN: doctrine://default?auto_setup=0
    SOFT_SERVE_NAME: ${SOFT_SERVE_NAME:-Gickers.sh}
    SOFT_SERVE_DATA_PATH: /app/.data
    # 0.0.0.0 inside the container; the host-side port is set per service below.
    SOFT_SERVE_SSH_LISTEN_ADDR: 0.0.0.0:2223
    SOFT_SERVE_HTTP_LISTEN_ADDR: 0.0.0.0:80
    SOFT_SERVE_SSH_PUBLIC_URL: ${SOFT_SERVE_SSH_PUBLIC_URL:-ssh://${APP_DOMAIN:-gits.run}}
    SOFT_SERVE_HTTP_PUBLIC_URL: ${SOFT_SERVE_HTTP_PUBLIC_URL:-https://${APP_DOMAIN:-gits.run}}
    SOFT_SERVE_LFS_ENABLED: ${SOFT_SERVE_LFS_ENABLED:-true}
    SOFT_SERVE_ANON_ACCESS: ${SOFT_SERVE_ANON_ACCESS:-read-only}
    SOFT_SERVE_ALLOW_KEYLESS: ${SOFT_SERVE_ALLOW_KEYLESS:-true}
    SOFT_SERVE_INITIAL_ADMIN_KEYS: ${SOFT_SERVE_INITIAL_ADMIN_KEYS:-}
    SOFT_SERVE_INITIAL_ADMIN_TOKEN: ${SOFT_SERVE_INITIAL_ADMIN_TOKEN:-}
    SOFT_SERVE_ALLOW_SIGNUP: ${SOFT_SERVE_ALLOW_SIGNUP:-true}
    SOFT_SERVE_WEBHOOK_ALLOW_LIST: ${SOFT_SERVE_WEBHOOK_ALLOW_LIST:-}
    DOCKER_HOST: ${DOCKER_HOST:-tcp://deploy-dockerd:2375}
    DEPLOY_GATEWAY_HOST: ${DEPLOY_GATEWAY_HOST:-deploy-dockerd}
    DEPLOY_DOCKER_RUNTIME: ${DEPLOY_DOCKER_RUNTIME:-runsc}
    CADDY_TLS: ${CADDY_TLS:-}
  volumes:
    - gickers-data:/app/.data
    - gickers-var:/app/var
  develop:
    watch:
      - action: rebuild
        path: ./Dockerfile
      - action: rebuild
        path: ./composer.json
      - action: rebuild
        path: ./composer.lock
      - action: rebuild
        path: ./cmd/gickers-ssh
      - action: rebuild
        path: ./migrations
      - action: rebuild
        path: ./src/Wiki/Application/DefaultWikiPages.php
      - action: rebuild
        path: ./src/Identity/Application/BootstrapServer.php
      - action: restart
        path: ./Caddyfile
      - action: restart
        path: ./.env
      - action: restart
        path: ./.env.docker

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gickers}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gickers}
      POSTGRES_DB: ${POSTGRES_DB:-gickers}
    volumes:
      - gickers-db:/var/lib/postgresql/data
    networks:
      - gickers-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gickers} -d ${POSTGRES_DB:-gickers}"]
      interval: 5s
      timeout: 3s
      retries: 10

  init:
    <<: *app
    command: ["serve", "--only=init"]
    networks:
      - gickers-internal
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  http:
    <<: *app
    command: ["serve", "--only=http", "--skip-init"]
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    networks:
      - gickers-internal
      - gickers-deploy-gateway
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      init:
        condition: service_completed_successfully
      deploy-dockerd:
        condition: service_healthy

  ssh:
    <<: *app
    command: ["serve", "--only=ssh", "--skip-init"]
    ports:
      - "${SSH_PORT:-22}:2223"
    environment:
      <<: *app-env
      CADDY_ADMIN_ADDR: http:2019
    networks:
      - gickers-internal
      - gickers-deploy-gateway
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      init:
        condition: service_completed_successfully
      deploy-dockerd:
        condition: service_healthy

  deploy-dockerd:
    build:
      context: .
      dockerfile: docker/deploy-engine/Dockerfile
    image: gickers-sh-deploy-engine:latest
    privileged: true
    environment:
      DEPLOY_GVISOR_PLATFORM: ${DEPLOY_GVISOR_PLATFORM:-systrap}
    volumes:
      - gickers-deploy-engine:/var/lib/docker
    networks:
      - gickers-deploy-gateway
    restart: unless-stopped
    develop:
      watch:
        - action: rebuild
          path: ./docker/deploy-engine
    healthcheck:
      test: ["CMD-SHELL", "docker info >/dev/null 2>&1"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  worker:
    <<: *app
    command: ["serve", "--only=worker", "--skip-init"]
    environment:
      <<: *app-env
      CADDY_ADMIN_ADDR: http:2019
    networks:
      - gickers-internal
      - gickers-deploy-gateway
    restart: unless-stopped
    develop:
      watch:
        - action: restart
          path: ./src
        - action: restart
          path: ./config
        - action: restart
          path: ./.env
        - action: restart
          path: ./.env.docker
        - action: rebuild
          path: ./Dockerfile
        - action: rebuild
          path: ./composer.json
        - action: rebuild
          path: ./composer.lock
    depends_on:
      postgres:
        condition: service_healthy
      init:
        condition: service_completed_successfully
      deploy-dockerd:
        condition: service_healthy

networks:
  gickers-internal:
    driver: bridge
  gickers-deploy-gateway:
    name: gickers-deploy-gateway
    driver: bridge

volumes:
  gickers-data:
  gickers-db:
  gickers-var:
  gickers-deploy-engine:
